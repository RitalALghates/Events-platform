<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تواصل معنا | منصة الفعاليات</title>
  <meta name="description" content="راسلنا على البريد: events@platform.com" />
  <meta name="theme-color" content="#0a0817" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <div class="container nav">
      <a class="logo" href="index.html" aria-label="منصة الفعاليات">
        <span class="logo-mark">🎟️</span>
        <span>منصة الفعاليات<small>EVENTBOOK</small></span>
      </a>
      <nav aria-label="التنقل الرئيسي">
        <ul>
          <li><a href="index.html">الرئيسية</a></li>
          <li><a href="events.html">الفعاليات</a></li>
          <li><a href="about.html">حول</a></li>
          <li><a href="contact.html">تواصل</a></li>
        </ul>
      </nav>
      <div class="clock" title="الوقت الحالي"><span id="current-date-time"></span></div>
      <button class="menu-btn" aria-label="القائمة">☰</button>
    </div>
  </header>

  <main>
    <div class="page-hero">
      <div class="container">
        <span class="eyebrow">✦ يسعدنا سماعك</span>
        <h1>تواصل <span class="grad-text">معنا</span></h1>
        <p>لأي استفسار أو اقتراح، راسلنا وسنرد عليك في أقرب وقت.</p>
      </div>
    </div>

    <section id="contact">
      <div class="container contact-grid">
        <div>
          <div class="contact-item reveal">
            <span class="ico">✉️</span>
            <div><b>البريد الإلكتروني</b><a class="ltr" href="mailto:events@platform.com"><span>events@platform.com</span></a></div>
          </div>
          <div class="contact-item reveal">
            <span class="ico">📍</span>
            <div><b>نخدم</b><span>جدة · الرياض · المملكة العربية السعودية</span></div>
          </div>
        </div>

        <div class="panel reveal">
          <form data-mailto="events@platform.com" data-toast-form="جارٍ فتح بريدك لإرسال الرسالة…" novalidate>
            <div class="form-row"><label for="c-name">الاسم</label><input id="c-name" placeholder="اكتب اسمك" autocomplete="name" /></div>
            <div class="form-row"><label for="c-email">البريد الإلكتروني</label><input id="c-email" type="email" class="ltr" placeholder="name@example.com" autocomplete="email" /></div>
            <div class="form-row"><label for="c-msg">رسالتك</label><textarea id="c-msg" rows="5" placeholder="كيف نقدر نساعدك؟"></textarea></div>
            <button class="btn" type="submit" style="width:100%">إرسال الرسالة</button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="container"><p>&copy; 2025 منصة الفعاليات - جميع الحقوق محفوظة</p></div>
  </footer>
</body>
</html>
