<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الفعاليات | منصة الفعاليات</title>
  <meta name="description" content="تصفّح الفعاليات القادمة وصفِّها حسب النوع، ثم احجز تذكرتك." />
  <meta name="theme-color" content="#0a0817" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <div class="container nav">
      <a class="logo" href="index.html" aria-label="منصة الفعاليات">
        <span class="logo-mark">🎟️</span>
        <span>منصة الفعاليات<small>EVENTBOOK</small></span>
      </a>
      <nav aria-label="التنقل الرئيسي">
        <ul>
          <li><a href="index.html">الرئيسية</a></li>
          <li><a href="events.html">الفعاليات</a></li>
          <li><a href="about.html">حول</a></li>
          <li><a href="contact.html">تواصل</a></li>
        </ul>
      </nav>
      <div class="clock" title="الوقت الحالي"><span id="current-date-time"></span></div>
      <button class="menu-btn" aria-label="القائمة">☰</button>
    </div>
  </header>

  <main>
    <div class="page-hero">
      <div class="container">
        <span class="eyebrow">✦ تصفّح واحجز</span>
        <h1>الفعاليات <span class="grad-text">القادمة</span></h1>
        <p>اختر نوع الفعالية أو ابحث بالاسم والمكان.</p>
      </div>
    </div>

    <section id="events" style="padding-top: 30px">
      <div class="container">
        <div class="toolbar">
          <div class="search"><input id="event-search" type="search" placeholder="ابحث عن فعالية، مكان أو تاريخ…" aria-label="ابحث عن فعالية" /></div>
          <span id="result-count" style="color: var(--muted); font-weight: 700"></span>
        </div>
        <div class="chips" id="filter-chips" style="justify-content: flex-start; margin: 0 0 30px" aria-label="تصفية حسب النوع"></div>

        <div class="grid" id="events-grid"></div>
        <div class="empty" id="empty"><b>لا توجد نتائج 😕</b>جرّب كلمة بحث أخرى أو غيّر النوع.</div>
      </div>
    </section>
  </main>

  <footer>
    <div class="container"><p>&copy; 2025 منصة الفعاليات - جميع الحقوق محفوظة</p></div>
  </footer>
</body>
</html>
