<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>حول</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <header>
    <h1>منصة الفعاليات</h1>
    <nav>
      <ul>
        <li><a href="index.html">الرئيسية</a></li>
        <li><a href="events.html">الفعاليات</a></li>
        <li><a href="about.html">حول</a></li>
        <li><a href="contact.html">تواصل</a></li>
      </ul>
    </nav>
  </header>

  <!-- Clock Section -->
  <div id="date-time-container" style="text-align: left; padding: 10px; font-size: 18px;">
    <p id="current-date-time"></p>
  </div>

  <main>
    <section id="about">
      <h2>عن المنصة</h2>
      <p>منصة إلكترونية مبتكرة تهدف لتسهيل الوصول إلى الفعاليات المحلية والثقافية والترفيهية في السعودية. احجز تذكرتك بضغطة زر!</p>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 منصة الفعاليات - جميع الحقوق محفوظة</p>
  </footer>

  <script>
    // Function to update the clock
    function updateClock() {
      const date = new Date();
      const options = { 
          year: 'numeric', 
          month: 'long', 
          day: 'numeric', 
          hour: '2-digit', 
          minute: '2-digit', 
          second: '2-digit', 
          hour12: true 
      };
      const formattedDate = date.toLocaleString('ar-SA', options);
      document.getElementById('current-date-time').innerHTML = formattedDate;
    }

    setInterval(updateClock, 1000);
    updateClock(); // Initial call to show the time immediately
  </script>

</body>
</html>
